site_name: Website
site_url: https://wijkqwe.github.io/
repo_url: https://github.com/Wijkqwe/Wijkqwe.github.io
remote_branch: site

nav:
  - Home:
    - index.md
  - Note:
    - note/index.md
    - Browser Plugin: note/browser_plugin.md
    - C#: note/c#.md
    - Cmd: note/cmd.md
    - C++: note/cpp.md
    - Gdb: note/gdb.md
    - Git: note/git.md
    - Java: note/java.md
    - Kitty: note/kitty.md
    - Markdown: note/markdown.md
    - Npm: note/npm.md
    - Opencode: note/opencode.md
    - Pacman: note/pacman.md
    - Potpourri:
        - Daemons: note/potpourri/daemons.md
        - Data Wrangling: note/potpourri/data_wrangling.md
        - Debug: note/potpourri/debug.md
        - Keyboard: note/potpourri/keyboard.md
        - Make: note/potpourri/make.md
        - Security: note/potpourri/security.md
        - Test: note/potpourri/test.md
        - Version: note/potpourri/version.md
        - VPN: note/potpourri/VPN.md
    - Powershell: note/powershell.md
    - Python: note/python.md
    - Shell: note/shell.md
    - Stow: note/stow.md
    - Tmux: note/tmux.md
    - Tools: note/tools.md
    - Vim: note/vim.md
    - Virtualbox: note/virtualbox.md
    - Vue: note/vue.md
    - 编译原理: note/编译原理.md
    - 体系结构: note/体系结构.md


theme:
  name: material
  language: zh
  features:        # 开启功能（导航、返回顶部等）
    # - navigation.tabs
    - navigation.top
  palette:         # 颜色方案（支持亮/暗切换）
    - scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式
    - scheme: slate   # 暗色模式
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式
